set -g base-index 1
set -g pane-base-index 1
set -g mouse on

# Tmux Appearance -------------------- {{{
# Basic status bar colors (Transparent-like feel)
set -g status-style fg=#cdd6f4,bg=#000000

# Left side of status bar (Session name)
# We use the Blue accent here to match your Rofi prompt
set -g status-left " #[fg=#000000,bold] #S "
set -g status-left-length 20
set -g status-left-style fg=#000000,bg=#89b4fa

# Window status - INACTIVE
# Using a muted grey that matches your Waybar inactive workspaces
set -g window-status-style fg=#6c7086,bg=#000000
set -g window-status-format " #I:#W "

# Window status - ACTIVE
# Using a clean underline/selection look to match Neovim Mini.Pick
set -g window-status-current-style fg=#89b4fa,bold,bg=#000000
set -g window-status-current-format " #[fg=#89b4fa]#[fg=#cdd6f4] #I:#W "

# Pane borders (matches Alacritty/Niri borders)
set -g pane-border-style fg=#313244
set -g pane-active-border-style fg=#89b4fa

# Right side widgets
wg_prfx=" #[fg=#f38ba8,bg=default]#{?client_prefix,󰊠 ,}"
wg_date=" #[fg=#6c7086,bg=default]%d-%b-%Y"
wg_time=" #[fg=#89b4fa,bold,bg=default] %H:%M "

set -g status-right "${wg_prfx}${wg_date}${wg_time}"

# Message/Command line colors
set -g message-style fg=#89b4fa,bg=#181818,bold
# }}}

unbind C-b
set -g prefix  C-a
bind C-a send-prefix

# Easy bindings for split
bind "'" split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# vi yank
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
# unbind -T copy-mode-vi MouseDragEnd1Pane #

# forget the find window.  That is for chumps
bind-key -r f run-shell "tmux neww ~/.config/scripts/tmux-sessionizer"
bind-key -r G run-shell ".local/share/nvim/lazy/harpoon/scripts/tmux/switch-back-to-nvim"

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Create a pane with the current pane's path
bind -r m neww -c "#{pane_current_path}"

# reload tmux config
# to install plugin type bind I
bind -r r source-file ~/.config/tmux/tmux.conf


# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'

# initialize tpm
run '~/.config/tmux/plugins/tpm/tpm'
