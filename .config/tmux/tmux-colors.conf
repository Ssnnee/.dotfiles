# Auto-generated by Matugen

set -g status-bg                          "{{colors.surface_container_lowest.default.hex}}"
set -gq @thm_bar_bg                       "{{colors.surface_container_lowest.default.hex}}"

set -gq @thm_bg                           "{{colors.surface.default.hex}}"
set -gq @thm_fg                           "{{colors.on_surface.default.hex}}"
set -gq @thm_primary                      "{{colors.primary.default.hex}}"
set -gq @thm_inverse_primary              "{{colors.inverse_primary.default.hex}}"
set -gq @thm_surface_low                  "{{colors.surface_container_low.default.hex}}"
set -gq @thm_surface                      "{{colors.surface_container.default.hex}}"
set -gq @thm_surface_variant              "{{colors.surface_container_high.default.hex}}"
set -gq @thm_outline                      "{{colors.outline_variant.default.hex}}"
set -gq @thm_text_variant                 "{{colors.on_surface_variant.default.hex}}"


# -------------------- Status Bar --------------------
set -g status-style "bg=#{@thm_bg},fg=#{@thm_fg}"

# Left side (Session name)
set -g status-left " #[fg=black,bold] #S "
set -g status-left-length 20
set -g status-left-style "fg=black,bg=#{@thm_primary}"

# Window status - INACTIVE
set -g window-status-style "fg=#{@thm_surface_variant},bg=#000000"
set -g window-status-format " #I:#W "

# Window status - ACTIVE
set -g window-status-current-style "fg=#{@thm_primary},bold,bg=#000000"
set -g window-status-current-format " #[fg=#{@thm_primary}]#[fg=#{@thm_fg}] #I:#W "

# Pane borders
set -g pane-border-style "fg=#{@thm_surface_variant}"
set -g pane-active-border-style "fg=#{@thm_primary}"

# Right side widgets
wg_prfx=" #[fg=#f38ba8,bg=default]#{?client_prefix,󰊠 ,}"
wg_date=" #[fg=#{@thm_surface_variant},bg=default]%d-%b-%Y"
wg_time=" #[fg=#{@thm_primary},bold,bg=default] %H:%M "

set -g status-right "${wg_prfx}${wg_date}${wg_time}"

# Message/Command line colors
set -g message-style "fg=#{@thm_primary},bg=#{@thm_surface_low},bold"

