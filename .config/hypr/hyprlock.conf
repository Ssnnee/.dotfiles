source = colors.conf
general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = $image   # Uses the wallpaper variable
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.7
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $primary
    font_size = 120
    font_family = UbuntuMono Nerd Font
    position = 0, 300
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = $on_surface
    font_size = 24
    font_family = UbuntuMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

# User info
label {
    monitor =
    text = $USER
    color = $on_surface_variant
    font_size = 18
    font_family = UbuntuMono Nerd Font
    position = 0, -120
    halign = center
    valign = center
}

# Input Field
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = $primary
    inner_color = $surface_container
    font_color = $on_surface
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <span foreground="$on_surface_variant">Enter Password...</span>
    hide_input = false
    rounding = 8
    check_color = $tertiary
    fail_color = $error
    fail_text = <span foreground="$error">Authentication Failed</span>
    fail_timeout = 2000
    fail_transitions = 300
    capslock_color = $secondary
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -200
    halign = center
    valign = center
}

# Keyboard Layout Indicator
label {
    monitor =
    text = $LAYOUT
    color = $primary
    font_size = 16
    font_family = UbuntuMono Nerd Font
    position = -30, -30
    halign = right
    valign = top
}

# Caps Lock warning
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/capslock.sh
    color = $secondary
    font_size = 14
    font_family = UbuntuMono Nerd Font
    position = 0, -260
    halign = center
    valign = center
}

# Battery status (optional - for laptops)
label {
    monitor =
    text = cmd[update:10000] echo "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo '')$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | grep -q Charging && echo '  ' || echo ' ')"
    color = $tertiary
    font_size = 16
    font_family = UbuntuMono Nerd Font
    position = -30, 30
    halign = right
    valign = bottom
}

# Subtle bottom corner decoration
label {
    monitor =
    text = Locked
    color = $on_surface_variant
    font_size = 12
    font_family = UbuntuMono Nerd Font
    position = 30, 30
    halign = left
    valign = bottom
}

