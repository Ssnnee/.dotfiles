source = colors.conf

monitor=,preferred,auto,1

$terminal = st
$fileManager = pcmanfm-qt
$menu = rofi -show drun run
# $menu = fuzzel

# Default env vars
env = HYPRCURSOR_THEME,Future-Cyan-Hyprcursor_Theme
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct

input {
  kb_layout = fr
  kb_variant = optimot_ansi_18
  kb_model =
  kb_options = caps:swapescape
  kb_rules =

  follow_mouse = 1

  touchpad {
    natural_scroll = no
    disable_while_typing = yes
  }

  touchdevice {
    enabled = no
  }

  sensitivity = 0
  repeat_rate = 100
  repeat_delay = 200
}

general {
  gaps_in = 2
  gaps_out = 4
  border_size = 1
  col.active_border = $primary $secondary 45deg
  col.inactive_border = $outline
  layout = dwindle
  allow_tearing = false
}

group {
  groupbar {
    height = 2
    render_titles = false
    col.active = $primary
    col.inactive = $outline
  }
}

decoration {
  rounding = 6

  blur {
    enabled = false
    size = 3
    passes = 1
    vibrancy = 0.1696
  }
}

animations {
  enabled = true
  bezier = easeOutQuint,0.23,1,0.32,1
  bezier = easeInOutCubic,0.65,0.05,0.36,1
  bezier = linear,0,0,1,1
  bezier = almostLinear,0.5,0.5,0.75,1.0
  bezier = quick,0.15,0,0.1,1

  animation = global, 1, 10, default
  animation = border, 1, 5.39, easeOutQuint
  animation = windows, 1, 4.79, easeOutQuint
  animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
  animation = windowsOut, 1, 1.49, linear, popin 87%
  animation = fadeIn, 1, 1.73, almostLinear
  animation = fadeOut, 1, 1.46, almostLinear
  animation = fade, 1, 3.03, quick
  animation = layers, 1, 3.81, easeOutQuint
  animation = layersIn, 1, 4, easeOutQuint, fade
  animation = layersOut, 1, 1.5, linear, fade
  animation = fadeLayersIn, 1, 1.79, almostLinear
  animation = fadeLayersOut, 1, 1.39, almostLinear
  animation = workspaces, 1, 1.94, almostLinear, fade
  animation = workspacesIn, 1, 1.21, almostLinear, fade
  animation = workspacesOut, 1, 1.94, almostLinear, fade
}

dwindle {
  pseudotile = yes
  preserve_split = yes
}

gestures {
  workspace_swipe = yes
}

misc {
  force_default_wallpaper = -1
}

device {
  name = epic-mouse-v1
  sensitivity = -0.5
}

windowrulev2 = suppressevent maximize, class:.*

$mainMod = SUPER

# Keybinds
bind = $mainMod, t, togglegroup
bind = $mainMod, h, changegroupactive, b
bind = $mainMod, l, changegroupactive, f

bind = $mainMod SHIFT, h, movewindoworgroup, l
bind = $mainMod SHIFT, l, movewindoworgroup, r
bind = $mainMod SHIFT, k, movewindoworgroup, u
bind = $mainMod SHIFT, j, movewindoworgroup, d

bind = $mainMod, return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, A, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, F, fullscreen,

# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, down, movefocus, d
bind = $mainMod, up, movefocus, u
bind = $mainMod, right, movefocus, r

# Workspace navigation (Azerty codes)
bind = SUPER, code:10, workspace, 1
bind = SUPER, code:11, workspace, 2
bind = SUPER, code:12, workspace, 3
bind = SUPER, code:13, workspace, 4
bind = SUPER, code:14, workspace, 5
bind = SUPER, code:15, workspace, 6
bind = SUPER, code:16, workspace, 7
bind = SUPER, code:17, workspace, 8
bind = SUPER, code:18, workspace, 9
bind = SUPER, code:19, workspace, 10

# Move active window to workspace
bind = $mainMod SHIFT, code:10, movetoworkspacesilent, 1
bind = $mainMod SHIFT, code:11, movetoworkspacesilent, 2
bind = $mainMod SHIFT, code:12, movetoworkspacesilent, 3
bind = $mainMod SHIFT, code:13, movetoworkspacesilent, 4
bind = $mainMod SHIFT, code:14, movetoworkspacesilent, 5
bind = $mainMod SHIFT, code:15, movetoworkspacesilent, 6
bind = $mainMod SHIFT, code:16, movetoworkspacesilent, 7
bind = $mainMod SHIFT, code:17, movetoworkspacesilent, 8
bind = $mainMod SHIFT, code:18, movetoworkspacesilent, 9
bind = $mainMod SHIFT, code:19, movetoworkspacesilent, 10

# Moving windows
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, L, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d
bind = $mainMod SHIFT, J, swapwindow, d

# Scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspacesilent, special:magic

# Scroll workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod ALT, L, resizeactive, 20 0
bind = $mainMod ALT, H, resizeactive, -20 0
bind = $mainMod ALT, J, resizeactive, 0 20
bind = $mainMod ALT, K, resizeactive, 0 -20

# Volume/Brightness
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind=,XF86MonBrightnessDown, exec, brillo -q -U 5
bind=,XF86MonBrightnessUp, exec, brillo -q -A 5

# Screenshots
bind = , Print, exec, grim ~/pic/$(date +'%s_grim.png')
bind = $mainMod, Print, exec, grim -g "$(slurp)" ~/pic/$(date +'%s_grim.png')
bind = CONTROL, Print, exec, grim - | wl-copy

# Wallpaper (variable)
exec-once = swaybg --image $image

# Autostart apps
exec-once = waybar
exec-once = nm-applet
exec-once = hypridle
exec-once = lxpolkit
exec-once = emacs --daemon
exec-once = hyprctl dispatch workspace 1 ; st
exec-once = hyprctl dispatch workspace 3 ; st
exec-once = hyprctl dispatch workspace 2 ; flatpak run app.zen_browser.zen
exec-once = hyprctl dispatch workspace 4 ; flatpak run org.telegram.desktop
exec-once = hyprctl dispatch workspace 8 ; kdeconnect-app

# Launch apps
bind = $mainMod SHIFT, F, exec, flatpak run app.zen_browser.zen
bind = $mainMod SHIFT, T, exec, Telegram
bind = $mainMod SHIFT, B, exec, brave
bind = $mainMod, space, exec, st -e yazi
